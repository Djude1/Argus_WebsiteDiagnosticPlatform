# Gateway API 對外入口（NGINX Gateway Fabric，gatewayClassName: nginx）
# 全部路徑導到 frontend Service:80；frontend nginx 內部再反代 /api、/media 到 web
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argus-gateway
  namespace: argus
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argus-route
  namespace: argus
spec:
  parentRefs:
    - name: argus-gateway
  # 不指定 hostnames → 任何 Host 都吃（用 Gateway 位址直連）；要綁網域再加 hostnames
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
