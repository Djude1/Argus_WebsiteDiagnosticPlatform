# === 機密範本：請「複製成 secret.yaml」填入真實值後再 apply ===
#   cp 02-secret.example.yaml secret.yaml   # 然後編輯 secret.yaml
#   kubectl apply -f secret.yaml
# ⚠ 真實的 secret.yaml 絕不可 commit（已於 k8s/.gitignore 排除）。
# ⚠ 本檔會被 commit，所以「只能放佔位值，嚴禁填真實金鑰」。
apiVersion: v1
kind: Secret
metadata:
  name: argus-secret
  namespace: argus
type: Opaque
stringData:
  # DB 密碼：必須與 03-data.yaml 內 postgres 的 POSTGRES_PASSWORD 一致，
  # 且與下方 DATABASE_URL 內嵌的密碼一致。
  POSTGRES_PASSWORD: "CHANGE_ME_db_password"
  DATABASE_URL: "postgres://argus:CHANGE_ME_db_password@db:5432/argus"
  DJANGO_SECRET_KEY: "CHANGE_ME_django_secret_至少32字元"
  JWT_SECRET_KEY: "CHANGE_ME_jwt_secret_至少32字元"
  PASSWORD_RESET_TOKEN_PEPPER: "CHANGE_ME_password_reset_pepper_至少32字元"
  # 綠界商店資料（ecpay_test 用測試商店、ecpay 用正式商店）；實際值只能放 secret.yaml／叢集 Secret，禁止 commit。
  # ARGUS_PAYMENT_MODE 為 ecpay_test 或 ecpay 時三項都必須非空，否則 Django 會拒絕啟動。
  ECPAY_MERCHANT_ID: ""
  ECPAY_HASH_KEY: ""
  ECPAY_HASH_IV: ""
  # 大模型 API key（Hermes-Agent 啟用時才需要；預設 agent 關閉可留空）
  GLM_API_KEY: ""
  MINIMAX_API_KEY: ""
  GOOGLE_API_KEY: ""

  # OpenCode agent server 的 basic auth（對應該台的 OPENCODE_SERVER_USERNAME / PASSWORD）
  ARGUS_OPENCODE_USERNAME: ""
  ARGUS_OPENCODE_PASSWORD: ""
  # 首次 migrate 自動建立的超級使用者（不需要可留空並改用 createsuperuser）
  ARGUS_BOOTSTRAP_SUPERUSER_USERNAME: ""
  ARGUS_BOOTSTRAP_SUPERUSER_PASSWORD: ""
  # SMTP（DJANGO_EMAIL_BACKEND 切成 smtp 時才需要）
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  # Cloudflare Turnstile secret（Cloudflare 後台 Turnstile > 該 widget > Settings 取得）；
  # 留空＝不啟用人機驗證。ConfigMap 已有 TURNSTILE_SITE_KEY／TURNSTILE_HOSTNAMES。
  TURNSTILE_SECRET: ""
  # Google Search Console 串接（SEO 分析頁）：與 ConfigMap 的 GOOGLE_OAUTH_CLIENT_ID 為同一個 OAuth 用戶端；
  # 留空＝不提供 GSC 連接。OAuth 用戶端要登記每個對外網域的 https://<網域>/api/gsc/callback/。
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  # 選填：refresh token 加密金鑰（Fernet key）；留空＝由 DJANGO_SECRET_KEY 推導
  ARGUS_GSC_TOKEN_KEY: ""
  # Google PageSpeed Insights 金鑰（掃描勾使用體驗時量首頁 Lighthouse／CrUX）；留空＝不量測，
  # 效能分頁顯示「平台尚未設定」。Google Cloud 啟用 PageSpeed Insights API 後建立 API 金鑰。
  ARGUS_PAGESPEED_API_KEY: ""
  # OWASP ZAP 被動分析的 API 金鑰（選用，k8s/optional/zap-passive.yaml；同時要在 ConfigMap
  # 設 ARGUS_ZAP_ENABLED／ARGUS_ZAP_API_URL）。沒部署 ZAP 就留空
  ARGUS_ZAP_API_KEY: ""
  DEFAULT_FROM_EMAIL: "Argus 系統 <no-reply@argus.local>"
