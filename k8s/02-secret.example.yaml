# === 機密範本：請「複製成 secret.yaml」填入真實值後再 apply ===
#   cp 02-secret.example.yaml secret.yaml   # 然後編輯 secret.yaml
#   kubectl apply -f secret.yaml
# ⚠ 真實的 secret.yaml 絕不可 commit（已於 k8s/.gitignore 排除）。
# ⚠ 本檔會被 commit，所以「只能放佔位值，嚴禁填真實金鑰」。
apiVersion: v1
kind: Secret
metadata:
  name: argus-secret
  namespace: argus
type: Opaque
stringData:
  # DB 密碼：必須與 03-data.yaml 內 postgres 的 POSTGRES_PASSWORD 一致，
  # 且與下方 DATABASE_URL 內嵌的密碼一致。
  POSTGRES_PASSWORD: "CHANGE_ME_db_password"
  DATABASE_URL: "postgres://argus:CHANGE_ME_db_password@db:5432/argus"
  DJANGO_SECRET_KEY: "CHANGE_ME_django_secret_至少32字元"
  JWT_SECRET_KEY: "CHANGE_ME_jwt_secret_至少32字元"
  PASSWORD_RESET_TOKEN_PEPPER: "CHANGE_ME_password_reset_pepper_至少32字元"
  # 綠界 Stage 測試商店資料；正式值只能放 secret.yaml／叢集 Secret，禁止 commit。
  # ARGUS_PAYMENT_MODE=ecpay_test 時三項都必須非空，否則 Django 會拒絕啟動。
  ECPAY_MERCHANT_ID: ""
  ECPAY_HASH_KEY: ""
  ECPAY_HASH_IV: ""
  # 大模型 API key（Hermes-Agent 啟用時才需要；預設 agent 關閉可留空）
  GLM_API_KEY: ""
  MINIMAX_API_KEY: ""
  GOOGLE_API_KEY: ""

  # OpenCode agent server 的 basic auth（對應該台的 OPENCODE_SERVER_USERNAME / PASSWORD）
  ARGUS_OPENCODE_USERNAME: ""
  ARGUS_OPENCODE_PASSWORD: ""
  # 首次 migrate 自動建立的超級使用者（不需要可留空並改用 createsuperuser）
  ARGUS_BOOTSTRAP_SUPERUSER_USERNAME: ""
  ARGUS_BOOTSTRAP_SUPERUSER_PASSWORD: ""
  # SMTP（DJANGO_EMAIL_BACKEND 切成 smtp 時才需要）
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: "Argus 系統 <no-reply@argus.local>"
