# Task 8：argus-kali-runner image 的不可變 digest 推廣管線。
#
# 觸發：disabled 階段僅 workflow_dispatch（避免 push 自動 promote 真實 digest 而撤 VAP
#       sentinel 防線；詳見 on: 區塊）。Task 11 啟用後恢復 push 觸發。
# 與 build-backend / build-frontend 共用 argus-gitops-cd concurrency group，
# 序列化 GitOps write-back，避免同時改 k8s/ 時撞在一起。
#
# 推廣目標固定為 shijie85/argus-kali-runner（admission repository 尚未遷移，
# 其他 Docker Hub 帳號會在鎖定步驟被拒）。
name: Build & Push Kali Runner Image

# disabled 階段觸發策略（kali 雙重 disabled）：
# 只允許 workflow_dispatch 手動觸發，避免 push 到 main 時自動 promote 真實 digest、
# 撤除 k8s/11-kali-admission.yaml 的 VAP sentinel 防線（雙重 disabled → 單重）。
# Task 11 啟用後（已完成 Secret 靜態加密 + 授權 positive test），把下方 on.push 區塊
# 恢復：paths = kali-runner/**、本 workflow、scripts/promote_kali_image.py、tests/test_kali_image_promotion.py。
on:
  workflow_dispatch: {}

# 序列化 GitOps write-back：與 build-backend / build-frontend 共用同一個 group，
# 同時只有一個 write-back 在跑；queue:max 保留排隊中的 runs，避免密集 push 時較早的
# pending run 被後來者取代（對齊 quality.yml 的 queue:max 契約，禁用 cancel-in-progress）。
concurrency:
  group: argus-gitops-cd
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitOps write-back 需要 push 回 main
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # rebase 需要 main 完整歷史

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"

      - name: 鎖定 Docker Hub 帳號為 shijie85
        run: |
          if [ "${{ vars.DOCKERHUB_USERNAME }}" != "shijie85" ]; then
            echo "DOCKERHUB_USERNAME 必須為 shijie85（admission repository 尚未遷移）" >&2
            exit 1
          fi

      - name: runner 單元測試（純 Python，不需 Docker）
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s kali-runner/tests

      # 推送前先 local build + smoke test：read-only --self-test 與 sqlmap --version。
      # 與 brief Step 6 的驗證命令一致，確保 image 可在 restricted PSA 下啟動。
      - name: 預 build + smoke test
        run: |
          docker build -t argus-kali-runner:pretest ./kali-runner
          docker run --rm --read-only --user 65532:65532 --tmpfs /tmp:rw,nosuid,nodev,size=1g argus-kali-runner:pretest --self-test
          docker run --rm --user 65532:65532 --entrypoint /usr/local/bin/python argus-kali-runner:pretest /opt/sqlmap/sqlmap.py --version

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登入 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build 並推送不可變 runner
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./kali-runner
          file: ./kali-runner/Dockerfile
          # PVE k8s 節點為 x86，只 build amd64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/argus-kali-runner:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把 build-push-action 輸出的 digest（sha256:<hex>）推廣進兩份 GitOps 契約；
      # 與 build-backend / build-frontend 採同一個 write-back 模式：先抓 main 最新並
      # reset 成乾淨工作區，再推廣 digest，最後 bot 身份 push 回 main。
      # （先前版本先 promote 再 rebase，導致 rebase 撞 unstaged changes 而失敗。）
      - name: 把新 digest 推廣進 GitOps 契約
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # concurrency group argus-gitops-cd + queue:max 已序列化 write-back，
          # 此時不會有另一個 write-back 同時跑，故 reset --hard 一次到位、不需重試迴圈。
          git fetch origin main
          git reset --hard FETCH_HEAD
          # 在最新 main 基礎上推廣 digest（此時工作區乾淨，不會撞 rebase/commit）。
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/argus-kali-runner@${IMAGE_DIGEST}"
          uv run python scripts/promote_kali_image.py --image "${IMAGE}"
          uv run python scripts/promote_kali_image.py --check
          git add k8s/01-namespace-config.yaml k8s/11-kali-admission.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci(cd): promote argus-kali-runner digest"
          git push origin HEAD:main
