# 前端 image（nginx serve Vite 產物 + 反向代理 /api）
# 觸發：push 到 main 且動到 frontend/ 時，自動 build 並推到 Docker Hub
# 註：CI 內用 Dockerfile 的 node:20-alpine，不會踩到本機 Node v24 的 Rollup crash
name: Build & Push Frontend Image

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch: {} # 允許在 Actions 頁面手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登入 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 產生 image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/argus-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build 並推送
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          # GOOGLE_OAUTH_CLIENT_ID 是 build-time 值（會被打進前端 JS bundle）。
          # 它是公開的 OAuth client id（瀏覽器本來就看得到），故用 repo variable 即可。
          # 未設定時為空字串，行為與 docker-compose 的 ${GOOGLE_OAUTH_CLIENT_ID:-} 一致。
          build-args: |
            GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
